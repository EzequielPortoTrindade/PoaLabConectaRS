<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/html/ui/layout.css">

<title>Cadastro | EduBook</title>
</head>

<body>

<div class="container">

    <section class="form-area">

        <div class="logo">
            <img src="/html/assets/favicon-32x32.png" alt="Logo">
            <h2>EduBook</h2>
        </div>

        <div class="content">

            <h1>Crie sua conta</h1>

            <p>
                Faça parte da comunidade Maker e tenha acesso
                a projetos, cursos e ferramentas.
            </p>

            <form>

                <div class="form-group">
                    <label>Nome completo</label>
                    <input type="text" placeholder="Digite seu nome">
                </div>

                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="Digite seu e-mail">
                </div>

                <div class="form-group">
                    <label>Senha</label>

                    <div class="password">
                        <input type="password" placeholder="Crie uma senha">
                        <button type="button">👁</button>
                    </div>
                </div>

                <button class="btn">
                    Criar conta
                </button>

            </form>

            <p class="login-link">
                Já possui uma conta?
                <a href="#">Entrar</a>
            </p>

        </div>

    </section>

    <section class="banner">

        <img src="/html/assets/impressora3d2.jpg" alt="Maker">

        <div class="overlay">
            <h2>Aprenda, Crie e Inove</h2>

            <p>
                Projetos colaborativos, fabricação digital,
                eletrônica e impressão 3D.
            </p>
        </div>

    </section>

</div>

</body>
</html>
