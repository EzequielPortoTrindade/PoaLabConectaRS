<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/icon-logo.png" type="image/png">
    <link rel="stylesheet" href="../ui/login.css">
    <title>EduBook - Login</title>
</head>
<body>

    <div class="background"></div>

    <section class="login-container">

        <div class="login-card">

            <div class="logo">
                <img src="../assets/icon-logo.png" alt="Logo">
            </div>

            <h1>Bem-vindo</h1>

            <p>
                Acesse sua conta para continuar explorando o universo da
                fabricação digital.
            </p>

            <div class="input-group">
                <input type="email" id="email" placeholder="E-mail">
            </div>

            <div class="input-group">
                <input type="password" id="senha" placeholder="Senha">
            </div>

            <button onclick="login()">
                Entrar
            </button>

            <div class="links">
                <a href="#">Esqueceu sua senha?</a>
            </div>

            <div class="divider"></div>

            <p class="cadastro">
                Não possui conta?
                <a href="../cadastro/cadastro.html">
                    Criar Conta
                </a>
            </p>

        </div>

    </section>

</body>
</html>
