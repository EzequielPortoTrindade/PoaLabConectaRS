<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="/html/assets/logo-removebg-preview.png" type="image/x-icon">
<link rel="stylesheet" href="/html/ui/login.css">

<title>Login - PoaLab</title>
</head>

<body>

<div class="login-container">

    <section class="login">

        <img src="/html/assets/logo-removebg-preview.png" class="logo POALAB">

        <h1>Crie sua conta</h1>

        <p>
            Faça parte da comunidade Maker e tenha acesso
            a projetos, cursos e ferramentas.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label>E-mail</label>
                <input type="email" placeholder="Digite seu e-mail">
            </div>

            <div class="form-group">
                <label>Senha</label>

                <div class="password">
                    <input type="password" placeholder="Crie uma senha">
                    <button type="button">👁</button>
                </div>

            </div>

            <button type="submit">
                Criar conta
            </button>

        </form>

        <p class="login-link">
            Já possui uma conta?
            <a href="#">Entrar</a>
        </p>

    </section>

    <section class="banner">
        <img src="/html/assets/impressora3d2.jpg">
    </section>

</div>

</body>
</html>
